# Adapted from rime/rime-pinyin-simp (Apache-2.0).
# InkFlow: remove reverse lookup and external presets; explicit basic keys.
schema:
  schema_id: inkflow_pinyin
  name: InkFlow 简体拼音
  version: '1.3'
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: emoji_suggestion
    reset: 1
engine:
  processors: [ascii_composer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [simplifier@emoji_suggestion, uniquifier]
emoji_suggestion:
  opencc_config: inkflow_emoji.json
  option_name: emoji_suggestion
  tips: none
  inherit_comment: false
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    # Fuzz lowers typo-alias weights without rewriting preedit.
    # hz/hc/hs -> zh/ch/sh; repeated initial -> single initial.
    - fuzz/^([zcs])h/h$1/
    - fuzz/^([bpmfdtnlgkhjqxrzcsyw])(?=[a-z])/$1$1/
    # Common final transpositions: ign -> ing, oa -> ao, ain -> ian.
    - fuzz/([aeiou])ng$/$1gn/
    - fuzz/ao$/oa/
    - fuzz/([iu])a(o|ng?)?$/a$1$2/
translator:
  dictionary: pinyin_simp
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
    '(': '（'
    ')': '）'
    # Basic PinyinKeyboard mappings observed on macOS 26.6.2 (ABC key labels).
    '{': '「'
    '}': '」'
    '[': '【'
    ']': '】'
    '<': '《'
    '>': '》'
    '\': '、'
    '|': '｜'
    '`': '·'
    '~': '～'
    '$': '¥'
    '^': '……'
    '_': '——'
    # Rime alternates each pair within the current engine component's lifetime.
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
