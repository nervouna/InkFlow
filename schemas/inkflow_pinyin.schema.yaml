# Adapted from rime/rime-pinyin-simp (Apache-2.0).
# InkFlow: remove reverse lookup and external presets; explicit basic keys.
schema:
  schema_id: inkflow_pinyin
  name: InkFlow 简体拼音
  version: '1.8'
  dependencies: [easy_en, inkflow_mixed, inkflow_spelling_0, inkflow_spelling_1, inkflow_spelling_2, inkflow_spelling_3, inkflow_spelling_4, inkflow_spelling_5, inkflow_spelling_6, inkflow_spelling_7, inkflow_spelling_8, inkflow_spelling_9, inkflow_spelling_10, inkflow_spelling_11, inkflow_spelling_12, inkflow_spelling_13, inkflow_spelling_14, inkflow_spelling_15, inkflow_spelling_16, inkflow_spelling_17, inkflow_spelling_18, inkflow_spelling_19, inkflow_spelling_20, inkflow_spelling_21, inkflow_spelling_22, inkflow_spelling_23, inkflow_spelling_24, inkflow_spelling_25, inkflow_spelling_26, inkflow_spelling_27, inkflow_spelling_28, inkflow_spelling_29, inkflow_spelling_30, inkflow_spelling_31]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: emoji_suggestion
    reset: 1
  - name: ascii_punct
    reset: 0
  - name: traditional
    reset: 0
engine:
  processors: [ascii_composer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, table_translator@custom_phrase, script_translator, lua_translator@*inkflow_mixed, lua_translator@*inkflow_english]
  filters: [simplifier@emoji_suggestion, simplifier@traditional, uniquifier, lua_filter@*inkflow_short_conflict]
emoji_suggestion:
  opencc_config: inkflow_emoji.json
  option_name: emoji_suggestion
  tips: none
  inherit_comment: false
traditional:
  opencc_config: inkflow_s2t.json
  option_name: traditional
  tips: none
  excluded_types: [user_table, simplified]
inkflow_short_conflict:
  inputs: [can, you, she, he, man, bug]
custom_phrase:
  dictionary: ""
  user_dict: inkflow_custom_phrases_empty
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 100
speller:
  alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
  algebra:
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    # Fuzz lowers typo-alias weights without rewriting preedit.
    # hz/hc/hs -> zh/ch/sh; repeated initial -> single initial.
    - fuzz/^([zcs])h/h$1/
    - fuzz/^([bpmfdtnlgkhjqxrzcsyw])(?=[a-z])/$1$1/
    # Common final transpositions: ign -> ing, oa -> ao, ain -> ian.
    - fuzz/([aeiou])ng$/$1gn/
    - fuzz/ao$/oa/
    - fuzz/([iu])a(o|ng?)?$/a$1$2/
translator:
  dictionary: pinyin_simp
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
english:
  dictionary: easy_en
  enable_user_dict: false
mixed:
  dictionary: inkflow_mixed
  enable_completion: false
  enable_user_dict: false
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([jqxy])v/$1u/
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
    '(': '（'
    ')': '）'
    # Basic PinyinKeyboard mappings observed on macOS 26.6.2 (ABC key labels).
    '{': '「'
    '}': '」'
    '[': '【'
    ']': '】'
    '<': '《'
    '>': '》'
    '\': '、'
    '|': '｜'
    '`': '·'
    '~': '～'
    '$': '¥'
    '^': '……'
    '_': '——'
    # Rime alternates each pair within the current engine component's lifetime.
    '"': { pair: ['“', '”'] }
    "'": { pair: ['‘', '’'] }
ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
