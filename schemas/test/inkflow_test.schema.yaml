schema:
  schema_id: inkflow_test
  name: InkFlow Deterministic Test
  version: "1.0.0"
  author:
    - InkFlow contributors
  description: >-
    Isolated table schema for engine contract tests; never packaged as product data.

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

menu:
  page_size: 9

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"

translator:
  dictionary: inkflow_test
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  encode_commit_history: false
