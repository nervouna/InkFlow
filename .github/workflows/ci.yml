name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundaries:
    name: Shared-core boundaries
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install python3
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)
      - name: Check shared-core boundaries and root/core parity
        run: bash Core/scripts/check-boundaries.sh

  portable:
    name: Portable runtime (cargo test)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install CMake and Ninja
        run: pipx install cmake==3.31.6 && pipx install ninja==1.11.1.4
      - name: Install Fcitx5 development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfcitx5core-dev extra-cmake-modules libsqlite3-dev libicu-dev
      - name: Cache the native runtime build
        uses: actions/cache@v5
        with:
          path: build/portable
          key: portable-${{ runner.os }}-ubuntu-26.04-${{ hashFiles('Core/Portable/native-sources.lock.json', 'Core/Portable/build-native.py', 'Core/Portable/native/**', 'Core/Portable/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: portable-${{ runner.os }}-ubuntu-26.04-
      - name: Build the native runtime and run cargo test
        run: bash Core/Portable/test.sh
      - name: Configure the Fcitx5 plugin
        run: |
          cmake -S Linux/fcitx5 -B build/fcitx5 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DINKFLOW_CARGO_DIR="$PWD/build/portable/cargo/debug" \
            -DINKFLOW_NATIVE_PREFIX="$PWD/build/portable/prefix" \
            -DCMAKE_MODULE_LINKER_FLAGS="-Wl,--no-undefined"
      - name: Compile and link the Fcitx5 plugin
        run: cmake --build build/fcitx5 --parallel 4 --verbose
      - name: Run Fcitx5 CTest
        run: ctest --test-dir build/fcitx5 --output-on-failure --no-tests=error

  dictionary:
    name: Portable dictionary (cargo test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Cache the dictionary crate build
        uses: actions/cache@v5
        with:
          path: build/dictionary/cargo
          key: dictionary-${{ runner.os }}-${{ hashFiles('Core/Portable/dictionary/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: dictionary-${{ runner.os }}-
      - name: Test and verify the dictionary generator port
        run: bash Core/Portable/dictionary/test.sh

  scripts:
    name: Script and frontend helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install comment lint parsers
        run: |
          python3 -m venv "$RUNNER_TEMP/comment-lint"
          "$RUNNER_TEMP/comment-lint/bin/python" -m pip install -r scripts/comment-lint-requirements.txt
      - name: Reject new code comments
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: '"$RUNNER_TEMP/comment-lint/bin/python" -B scripts/comment-lint.py --base "$BASE"'
      - name: Test comment lint
        run: '"$RUNNER_TEMP/comment-lint/bin/python" -B scripts/tests/test_comment_lint.py'
      - name: Test Linux installer and frontend helpers
        run: |
          python3 -B Linux/scripts/test_install.py
          python3 -B Linux/scripts/test_quality.py
          bash Linux/fcitx5/test.sh
