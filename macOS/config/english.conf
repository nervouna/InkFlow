# Build-time gate shared by every automatic English candidate and mixed word.
# Zipf: log10(observed word probability * 1e9), inclusive minimum in 0..9.
ENGLISH_MIN_ZIPF=4.0
# Linear engine-weight mapping, rounded to integer; not a probability ratio.
# Positive integer <= 238609294 keeps the largest Zipf weight within int32.
ENGLISH_WEIGHT_SCALE=250000
# Positive divisor applied only to mixed composition after English admission.
MIXED_ENGLISH_WEIGHT_DIVISOR=100
