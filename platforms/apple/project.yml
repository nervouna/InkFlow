name: InkFlow

options:
  minimumXcodeGenVersion: 2.46.0
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_VERSION: "6.0"

targets:
  InkFlowAppleEngine:
    type: library.static
    platform: auto
    supportedDestinations: [macOS, iOS]
    deploymentTargets:
      macOS: "13.0"
      iOS: "16.0"
    sources:
      - path: Shared/InkFlowAppleEngine
    dependencies:
      - framework: Generated/InkFlowEngine.xcframework
        embed: false
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID_PREFIX).apple-engine
        PRODUCT_MODULE_NAME: InkFlowAppleEngine
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        SWIFT_INSTALL_OBJC_HEADER: NO

  InkFlowInputMethod:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: macOS/InputMethod
      - path: Generated/Schema
        type: folder
        buildPhase: resources
    dependencies:
      - target: InkFlowAppleEngine
        embed: false
      - framework: Generated/InkFlowEngine.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: InputMethodKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID_PREFIX).inputmethod
        PRODUCT_NAME: InkFlow
        INFOPLIST_FILE: macOS/InputMethod/Info.plist

  InkFlowKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOS/KeyboardExtension
      - path: Generated/Schema
        type: folder
        buildPhase: resources
    dependencies:
      - target: InkFlowAppleEngine
        embed: false
      - framework: Generated/InkFlowEngine.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID_PREFIX).app.keyboard
        PRODUCT_NAME: InkFlowKeyboard
        INFOPLIST_FILE: iOS/KeyboardExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  InkFlowApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOS/App
    dependencies:
      - target: InkFlowKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID_PREFIX).app
        PRODUCT_NAME: InkFlow
        INFOPLIST_FILE: iOS/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"

  InkFlowAppleEngineTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/InkFlowAppleEngineTests
      - path: iOS/KeyboardExtension/KeyboardEnginePipeline.swift
      - path: Generated/Schema
        type: folder
        buildPhase: resources
    dependencies:
      - target: InkFlowAppleEngine
        embed: false
      - framework: Generated/InkFlowEngine.xcframework
        embed: false
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(INKFLOW_BUNDLE_ID_PREFIX).apple-engine-tests

schemes:
  InkFlowInputMethod:
    build:
      targets:
        InkFlowInputMethod: all
  InkFlowApp:
    build:
      targets:
        InkFlowApp: all
  InkFlowAppleEngineTests:
    build:
      targets:
        InkFlowAppleEngineTests: [test]
    test:
      targets:
        - InkFlowAppleEngineTests
